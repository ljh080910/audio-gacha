<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오디오 가챠</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background:
    radial-gradient(circle at 20% 20%, #4635ff33, transparent 35%),
    radial-gradient(circle at 80% 80%, #00d4ff22, transparent 35%),
    #080a12;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.app {
  width: min(900px, 100%);
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: -2px;
}

.subtitle {
  color: #8f96ad;
  margin-top: 8px;
}

.card {
  background: rgba(20, 23, 38, 0.88);
  border: 1px solid #ffffff14;
  border-radius: 28px;
  padding: 35px;
  box-shadow: 0 25px 80px #00000066;
  backdrop-filter: blur(20px);
}

.badge {
  display: inline-block;
  padding: 7px 12px;
  border-radius: 999px;
  background: #5948ff22;
  color: #8f82ff;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 20px;
}

.question {
  font-size: clamp(25px, 5vw, 42px);
  line-height: 1.25;
  font-weight: 800;
  margin-bottom: 30px;
}

.answer {
  display: none;
  background: #ffffff08;
  border: 1px solid #ffffff12;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 25px;
  color: #d8dcf0;
  line-height: 1.7;
}

.answer.show {
  display: block;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

button {
  border: 0;
  border-radius: 16px;
  padding: 17px 20px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  transition: 0.18s;
}

button:hover {
  transform: translateY(-2px);
}

.gacha {
  width: 100%;
  margin-top: 15px;
  background: linear-gradient(135deg, #6655ff, #9d4edd);
  color: white;
  box-shadow: 0 10px 35px #6655ff44;
}

.review {
  background: #ffffff0d;
  color: white;
  border: 1px solid #ffffff12;
}

.check {
  background: #1ed760;
  color: #07110a;
}

.stats {
  display: flex;
  justify-content: space-between;
  margin-top: 25px;
  color: #858ba1;
  font-size: 14px;
}

.stats strong {
  color: white;
}

.history {
  margin-top: 20px;
  display: none;
}

.history.show {
  display: block;
}

.history h3 {
  margin-bottom: 12px;
}

.history-item {
  background: #ffffff07;
  border-radius: 12px;
  padding: 12px 15px;
  margin-bottom: 8px;
  font-size: 14px;
}

.correct {
  color: #1ed760;
}

.wrong {
  color: #ff5964;
}

@media (max-width: 600px) {
  body {
    padding: 12px;
  }

  .card {
    padding: 23px;
    border-radius: 22px;
  }

  .buttons {
    grid-template-columns: 1fr;
  }

  .logo {
    font-size: 34px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">🎧 AUDIO GACHA</div>
    <div class="subtitle">오늘의 음향 문제를 랜덤으로 뽑아보자</div>
  </div>

  <div class="card">

    <div class="badge" id="category">READY</div>

    <div class="question" id="question">
      아래 버튼을 눌러<br>
      첫 번째 문제를 뽑아봐.
    </div>

    <div class="answer" id="answer"></div>

    <div class="buttons">

      <button class="review" onclick="showAnswer()">
        📖 복습하기
      </button>

      <button class="check" onclick="checkAnswer()">
        ✓ 체크
      </button>

    </div>

    <button class="gacha" onclick="drawQuestion()">
      🎰 메인 문제 뽑기
    </button>

    <div class="stats">
      <span>뽑은 문제 <strong id="drawCount">0</strong></span>
      <span>정답 <strong id="correctCount">0</strong></span>
      <span>오답 <strong id="wrongCount">0</strong></span>
    </div>

    <div class="history" id="history">
      <h3>📊 최근 기록</h3>
      <div id="historyList"></div>
    </div>

  </div>
</div>

<script>

const questions = [
  {
    category: "음향 기초",
    question: "주파수(Frequency)란 무엇인가?",
    answer: "1초 동안 진동하는 횟수를 말한다. 단위는 Hz(헤르츠)를 사용한다."
  },
  {
    category: "음향 기초",
    question: "진폭(Amplitude)이 커지면 일반적으로 어떻게 들리는가?",
    answer: "소리가 더 크게 들린다. 진폭은 음압의 크기와 관련이 있다."
  },
  {
    category: "음향 기초",
    question: "사람이 일반적으로 들을 수 있는 주파수 범위는?",
    answer: "대략 20Hz ~ 20kHz이다. 개인의 나이와 청력에 따라 달라질 수 있다."
  },
  {
    category: "마이크",
    question: "다이내믹 마이크와 콘덴서 마이크의 대표적인 차이는?",
    answer: "다이내믹 마이크는 구조가 비교적 단순하고 높은 음압에 강한 편이며, 콘덴서 마이크는 높은 감도와 섬세한 고주파 응답을 갖는 경우가 많다."
  },
  {
    category: "스피커",
    question: "스피커의 임피던스(Impedance)는 무엇을 나타내는가?",
    answer: "교류 신호에서 전류의 흐름을 방해하는 정도를 나타내는 값이다. 단위는 Ω(옴)을 사용한다."
  }
];

let currentQuestion = null;
let drawCount = 0;
let correctCount = 0;
let wrongCount = 0;

function drawQuestion() {

  const index = Math.floor(Math.random() * questions.length);
  currentQuestion = questions[index];

  document.getElementById("category").textContent =
    currentQuestion.category;

  document.getElementById("question").textContent =
    currentQuestion.question;

  document.getElementById("answer").textContent =
    currentQuestion.answer;

  document.getElementById("answer").classList.remove("show");

  drawCount++;

  document.getElementById("drawCount").textContent = drawCount;
}

function showAnswer() {

  if (!currentQuestion) return;

  document.getElementById("answer").classList.add("show");
}

function checkAnswer() {

  if (!currentQuestion) {
    alert("먼저 문제를 하나 뽑아.");
    return;
  }

  const result = confirm(
    "이 문제를 맞혔어?\n\n확인 = 정답\n취소 = 오답"
  );

  if (result) {
    correctCount++;
    addHistory("정답", currentQuestion.question);
  } else {
    wrongCount++;
    addHistory("오답", currentQuestion.question);
  }

  document.getElementById("correctCount").textContent =
    correctCount;

  document.getElementById("wrongCount").textContent =
    wrongCount;
}

function addHistory(result, question) {

  const history = document.getElementById("history");
  const list = document.getElementById("historyList");

  history.classList.add("show");

  const item = document.createElement("div");

  item.className = "history-item";

  item.innerHTML =
    `<span class="${result === "정답" ? "correct" : "wrong"}">
      ${result}
    </span> · ${question}`;

  list.prepend(item);
}
/* =========================
   7일 오답 노트
========================= */

(function () {
  const STORAGE_KEY = "audioGachaWrongNote_v1";

  function todayKey() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function getData() {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
      try {
        return JSON.parse(saved);
      } catch (e) {}
    }

    return {
      startDate: todayKey(),
      records: {}
    };
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function dayNumber(startDate) {
    const start = new Date(startDate + "T00:00:00");
    const now = new Date(todayKey() + "T00:00:00");

    const diff = Math.floor(
      (now - start) / (1000 * 60 * 60 * 24)
    );

    return Math.max(1, Math.min(7, diff + 1));
  }

  function cleanOldRecords(data) {
    const keys = Object.keys(data.records);

    keys.forEach(key => {
      const start = new Date(data.startDate + "T00:00:00");
      const date = new Date(key + "T00:00:00");

      const diff = Math.floor(
        (date - start) / (1000 * 60 * 60 * 24)
      );

      if (diff < 0 || diff >= 7) {
        delete data.records[key];
      }
    });

    saveData(data);
  }

  /* 기존 addHistory를 그대로 살리면서
     '오답'일 때 localStorage에도 저장 */
  const originalAddHistory = window.addHistory;

  window.addHistory = function (result, question) {
    if (typeof originalAddHistory === "function") {
      originalAddHistory(result, question);
    }

    if (result !== "오답") return;

    const data = getData();
    const date = todayKey();

    if (!data.records[date]) {
      data.records[date] = [];
    }

    data.records[date].push({
      question: String(question || ""),
      time: new Date().toLocaleTimeString("ko-KR")
    });

    cleanOldRecords(data);
    saveData(data);
    renderWrongNote();
  };

  /* 오답노트 UI */
  function createWrongNote() {
    if (document.getElementById("wrongNoteBox")) return;

    const box = document.createElement("div");
    box.id = "wrongNoteBox";

    box.innerHTML = `
      <div class="wrong-note-title">
        📝 7일 오답 노트
      </div>

      <div id="wrongNoteInfo" class="wrong-note-info"></div>

      <div class="wrong-note-buttons">
        <button id="wrongTodayBtn">오늘</button>
        <button id="wrongYesterdayBtn">어제</button>
        <button id="wrongAllBtn">7일 전체</button>
        <button id="wrongResetBtn">날짜 리셋</button>
      </div>

      <div id="wrongNoteList"></div>
    `;

    const app = document.querySelector(".app");

    if (app) {
      app.appendChild(box);
    } else {
      document.body.appendChild(box);
    }

    document.getElementById("wrongTodayBtn").onclick = function () {
      renderWrongNote("today");
    };

    document.getElementById("wrongYesterdayBtn").onclick = function () {
      renderWrongNote("yesterday");
    };

    document.getElementById("wrongAllBtn").onclick = function () {
      renderWrongNote("all");
    };

    document.getElementById("wrongResetBtn").onclick = function () {
      const ok = confirm(
        "7일 오답 기록을 모두 지우고 새로운 1일차로 시작할까?"
      );

      if (!ok) return;

      const data = {
        startDate: todayKey(),
        records: {}
      };

      saveData(data);
      renderWrongNote("today");
      alert("날짜가 리셋됐어. 오늘부터 다시 1일차다.");
    };

    renderWrongNote("today");
  }

  function renderWrongNote(mode = "today") {
    const data = getData();
    cleanOldRecords(data);

    const list = document.getElementById("wrongNoteList");
    const info = document.getElementById("wrongNoteInfo");

    if (!list || !info) return;

    const currentDay = dayNumber(data.startDate);

    info.innerHTML =
      `현재 <b>${currentDay}일차</b> · 시작일 ${data.startDate}`;

    let entries = [];

    if (mode === "today") {
      const date = todayKey();

      entries = (data.records[date] || []).map(item => ({
        date,
        ...item
      }));
    }

    if (mode === "yesterday") {
      const d = new Date();
      d.setDate(d.getDate() - 1);

      const date =
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0");

      entries = (data.records[date] || []).map(item => ({
        date,
        ...item
      }));
    }

    if (mode === "all") {
      Object.keys(data.records)
        .sort()
        .forEach(date => {
          data.records[date].forEach(item => {
            entries.push({
              date,
              ...item
            });
          });
        });
    }

    if (entries.length === 0) {
      list.innerHTML = `
        <div class="wrong-empty">
          이 날짜에는 틀린 문제가 없음.
        </div>
      `;
      return;
    }

    list.innerHTML = entries
      .map((item, index) => `
        <div class="wrong-item">
          <div class="wrong-item-top">
            <span>❌ 오답 ${index + 1}</span>
            <small>${item.date} ${item.time}</small>
          </div>

          <div class="wrong-question">
            ${escapeHTML(item.question)}
          </div>
        </div>
      `)
      .join("");
  }

  function escapeHTML(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  /* CSS 추가 */
  const style = document.createElement("style");

  style.textContent = `
    #wrongNoteBox {
      margin-top: 30px;
      padding: 22px;
      border-radius: 18px;
      background: rgba(20, 25, 55, 0.95);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .wrong-note-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .wrong-note-info {
      color: #9fa8c7;
      margin-bottom: 15px;
    }

    .wrong-note-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .wrong-note-buttons button {
      border: 0;
      border-radius: 10px;
      padding: 9px 13px;
      background: #30385f;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    .wrong-note-buttons button:hover {
      background: #4653a0;
    }

    #wrongResetBtn {
      background: #8b3045;
    }

    #wrongResetBtn:hover {
      background: #b33d58;
    }

    .wrong-item {
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      border-left: 4px solid #ff5577;
    }

    .wrong-item-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      color: #ff7892;
      font-weight: 700;
    }

    .wrong-item-top small {
      color: #8f98b5;
      font-weight: 400;
    }

    .wrong-question {
      color: white;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .wrong-empty {
      padding: 20px;
      text-align: center;
      color: #858eaa;
    }
  `;

  document.head.appendChild(style);

  /* 페이지가 만들어진 뒤 오답노트 생성 */
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", createWrongNote);
  } else {
    createWrongNote();
  }

})();
</script>

</body>
</html>
